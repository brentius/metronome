# Tiny Tapeout project information
project:
  title:        "Metronome"      # Project title
  author:       "brent"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Beat-synchronous protocol engine: a reprogrammable protocol emulator"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     60000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_brentius_metronome"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "data_mem.v"
    - "md_acc.v"
    - "md_beatgen.v"
    - "md_core.v"
    - "md_counter.v"
    - "md_ctrl.v"
    - "md_engine.v"
    - "md_flags.v"
    - "md_layout_check.v"
    - "md_lfsr.v"
    - "md_movebus.v"
    - "md_outcell.v"
    - "md_ptrs.v"
    - "md_shifter.v"
    - "md_spi.v"
    - "md_sync.v"
    - "md_wgroup.v"
    - "prog_mem.v"
    - "sram_bb.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HOST_SCK"
  ui[1]: "HOST_CS_N"
  ui[2]: "HOST_MOSI"
  ui[3]: "P8"
  ui[4]: "P9"
  ui[5]: "P10"
  ui[6]: "P11"
  ui[7]: "P12"

  # Outputs
  uo[0]: "HOST_MISO"
  uo[1]: "HOST_IRQ"
  uo[2]: "O8"
  uo[3]: "O9"
  uo[4]: "O10"
  uo[5]: "O11"
  uo[6]: "O12"
  uo[7]: "O13"

  # Bidirectional pins
  uio[0]: "P0/O0"
  uio[1]: "P1/O1"
  uio[2]: "P2/O2"
  uio[3]: "P3/O3"
  uio[4]: "P4/O4"
  uio[5]: "P5/O5"
  uio[6]: "P6/O6"
  uio[7]: "P7/O7"

# Do not change!
yaml_version: 6
